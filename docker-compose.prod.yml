services:
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: vault-backend:prod
    container_name: vault-prod-api-1
    env_file:
      - ./.env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "api.g4057.com,localhost,127.0.0.1"
      FRONTEND_URL: "https://g4057.com"
      CORS_ALLOWED_ORIGINS: "https://g4057.com,https://www.g4057.com"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://api.g4057.com,https://g4057.com,https://www.g4057.com"
      DATABASE_SSL_REQUIRE: "1"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
    ports:
      - "127.0.0.1:8400:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -H
        - "X-Forwarded-Proto: https"
        - http://127.0.0.1:8000/api/health/
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
